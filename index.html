HORIZON:[
{n:1,ic:"🚨",titre:"Sécurité civile",src:"« Organisation de la sécurité civile » + SC-C1 (Drive)",
 sections:[
 {t:"Cadre : la loi du 13 août 2004",pts:[
  "Loi n° 2004-811 du 13 août 2004 de modernisation de la sécurité civile — objet : prévention des risques de toute nature + protection des personnes, des biens et de l'environnement contre accidents, sinistres et catastrophes",
  "Elle instaure le plan communal de sauvegarde (PCS) et la réserve communale de sauvegarde — le PCS est obligatoire dans les communes soumises à un risque majeur"]},
 {t:"Les 4 niveaux d'organisation",pts:[
  "3 autorités de police administrative générale : le maire (commune), le préfet (département), le Premier ministre (national) — + la zone de défense et de sécurité en appui (planning, moyens, coordination supra-départementale)",
  "National : ministre de l'Intérieur → DGSCGC (COGIC), et CIC (cellule interministérielle de crise) pour les crises majeures nationales",
  "Départemental : préfet → SIPDC + SDIS/SDMIS (CODIS/CTA) ; Communal : maire → CIS/CS/CPI"]},
 {t:"Maire et préfet : qui dirige ?",pts:[
  "Le maire est le premier DOS (directeur des opérations de secours) : alerte et information des populations, appui aux services d'urgence, soutien des populations, information des autorités",
  "Le préfet prend la DOS quand : le maire ne maîtrise plus (ou s'abstient), l'événement concerne plusieurs communes, ou la gravité dépasse les capacités locales — il est épaulé par le COS et s'appuie sur le dispositif ORSEC",
  "Le préfet de zone : coordination et moyens (pas de pouvoir de police générale) ; ORSEC = seule doctrine interservices de portée réglementaire au niveau territorial"]}],
 quiz:[
 {q:"Quelle loi fixe les principes actuels de la sécurité civile française ?",opts:["La loi du 13 août 2004","La loi du 22 juillet 1987","Le décret ORSEC de 2006","La loi de 1955 état d'urgence"],a:0,ex:"Loi n° 2004-811 de modernisation de la sécurité civile : prévention + protection des personnes, biens, environnement."},
 {q:"Qui est le premier directeur des opérations de secours (DOS) ?",opts:["Le préfet","Le maire","Le commandant des opérations","Le directeur du SDIS"],a:1,ex:"Le maire est le premier DOS ; le préfet se substitue à lui si nécessaire (crise multi-communale, gravité, carence)."},
 {q:"Qu'instaure la loi de 2004 à l'échelon communal ?",opts:["Le PCS et la réserve communale de sauvegarde","Le SDIS","Le plan Vigipirate","La réserve citoyenne"],a:0,ex:"Plan communal de sauvegarde + réserve communale — outils du pouvoir de police du maire en situation d'urgence."},
 {q:"Qui coordonne une crise majeure nationale au sein du CIC ?",opts:["Le ministre de la Défense","Le Premier ministre lui-même toujours","Le ministre de l'Intérieur en principe","Le CEMA"],a:2,ex:"Pour une crise majeure sur le territoire national, le ministre de l'Intérieur assure en principe la coordination gouvernementale au sein de la cellule interministérielle de crise."}]},

{n:2,ic:"⚓",titre:"Marine nationale",src:"« La marine nationale » (DIM 2021, Drive)",
 sections:[
 {t:"Pourquoi une marine ?",pts:[
  "Domaine maritime français : 11 millions de km² — 2e ZEE mondiale derrière les USA ; 90 % du commerce mondial par voie maritime ; 99 % des télécommunications par câbles sous-marins ; 70 % de la population à moins de 100 km des côtes",
  "La mer = l'avenir de la terre : enjeux démographiques, économiques et militaires du contrôle des océans"]},
 {t:"Les 4 missions : dissuader, protéger, prévenir, intervenir",pts:[
  "Dissuader : FOST (4 SNLE, dont au moins 1 en mer en permanence) + FANu (PA Charles de Gaulle, Rafale marine)",
  "Protéger : PPSM = DMT (sentinelle des mers, ~20 000 km de côtes) + AEM (action de l'État en mer) ; lutte antipollution ; +300 vies/an sauvées ; CAPINAV projetable en cas de sinistre en mer",
  "Prévenir : capteurs, connaissance des zones de crise ; piraterie, pêche illicite (17 t de stupéfiants saisis en 2019) ; présence permanente Méditerranée orientale + océan Indien ; Grand Nord ; SHOM",
  "Intervenir : GAN projection de puissance (indépendant des autorisations d'états tiers), missile MdCN, PHA projection de force, commandos marine"]},
 {t:"Ressources, structure, ordre de bataille",pts:[
  "39 000 marins (13 % officiers / 65 % OM / 22 % équipage), 3 000 civils, 6 500 réservistes, ~15 % de femmes (5 825) ; 4 000 recrutements/an, 16-30 ans",

<script>
(function(){
"use strict";
var D=window.D;
var K={prog:"bht-prog-v1",quiz:"bht-quiz-v1",dtp:"bht-dtp-v1",notes:"bht-notes-v1",ui:"bht-ui-v1",hor:"bht-hor-v1"};
var STATES=["afaire","fiche","quiz","pret"];
var SLBL={afaire:"À faire",fiche:"Fiche faite",quiz:"Quiz réussi",pret:"PRÊT ORAL"};
var SEMO={afaire:"○",fiche:"◔",quiz:"◕",pret:"●"};
var SCL={afaire:"#e05b4b",fiche:"#e0a83b",quiz:"#4ba6e0",pret:"#3fce6b"};
var ALLQ=[];var HQ=[];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadState(){
  var prog=ls(K.prog,null)||{};
  D.THEMES.forEach(function(t){if(!prog[t.n])prog[t.n]=t.etat||"afaire";});
  var ui=ls(K.ui,null)||{tab:"home",theme:0,qmode:"theme",qsel:1};
  return {prog:prog,ui:ui,quiz:ls(K.quiz,null)||{},dtp:ls(K.dtp,null)||{},notes:ls(K.notes,null)||{},hor:ls(K.hor,null)||{}};
}
var S=loadState();
function save(){sv(K.prog,S.prog);sv(K.ui,S.ui);sv(K.quiz,S.quiz);sv(K.dtp,S.dtp);sv(K.notes,S.notes);sv(K.hor,S.hor);}
function theme(n){for(var i=0;i<D.THEMES.length;i++){if(D.THEMES[i].n===n)return D.THEMES[i];}return null;}
function buildQuiz(){
  ALLQ=[];
  D.THEMES.forEach(function(t){t.quiz.forEach(function(q,i){ALLQ.push({n:t.n,titre:t.titre,q:q,i:i});});});
  HQ=[];
  D.HORIZON.forEach(function(h){h.quiz.forEach(function(q,i){HQ.push({hid:h.n,titre:h.titre,q:q,i:i});});});
}
function hqTot(hid){
  var h=null;D.HORIZON.forEach(function(x){if(x.n===hid)h=x;});
  if(!h)return{ok:0,tot:0};
  var q=S.quiz["h"+hid];var ok=0;
  h.quiz.forEach(function(x,i){if(q&&q[i])ok++;});
  return{ok:ok,tot:h.quiz.length};
}
function progPct(){
  var v={afaire:0,fiche:1,quiz:2,pret:3},tot=0,sum=0;
  D.THEMES.forEach(function(t){tot+=3;sum+=v[S.prog[t.n]]||0;});
  return tot?Math.round(100*sum/tot):0;
}
function quizTot(t){
  var q=S.quiz[t.n];if(!q)return{ok:0,tot:t.quiz.length};
  var ok=0;t.quiz.forEach(function(x,i){if(q[i])ok++;});
  return{ok:ok,tot:t.quiz.length};
}
function cycle(n){
  if(S.prog[n]==="pret")return; // protégé : reset uniquement via le bouton dédié
  var i=STATES.indexOf(S.prog[n]);S.prog[n]=STATES[(i+1)%STATES.length];
  if(S.prog[n]==="quiz"){var z=quizTot(theme(n));if(z.ok<z.tot)S.prog[n]="fiche";}
  save();renderApp();
}
function resetTheme(n){S.prog[n]="afaire";save();renderApp();}
function donut(pct){
  var r=52,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<svg viewBox="0 0 130 130" class="donut"><circle cx="65" cy="65" r="'+r+'" class="d-b"/><circle cx="65" cy="65" r="'+r+'" class="d-f" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/><text x="65" y="61" class="d-t">'+pct+'%</text><text x="65" y="80" class="d-s">avancement</text></svg>';
}
function tirage(){
  var pool=D.THEMES.filter(function(t){return S.prog[t.n]!=="pret";});
  if(!pool.length)pool=D.THEMES.slice();
  var r=Math.random();
  if(r<0.15){var s=D.SURPRISES[Math.floor(Math.random()*D.SURPRISES.length)];return{type:"surprise",txt:s};}
  var t=pool[Math.floor(Math.random()*pool.length)];
  return{type:"theme",n:t.n,txt:t.titre};
}
/* ---------- CHRONO ---------- */
var TIM={id:null,mode:null,end:0,left:0,run:false,jalons:[],next:0};
var CHRONOS={
  oral:{label:"Oral 10 minutes",total:600,jalons:[[90,"Fin de l'introduction — lance la partie I"],[240,"Fin de la partie I — passe à la partie II"],[390,"Fin de la partie II — passe à la partie III"],[510,"Fin de la partie III — conclusion !"],[600,"STOP — 10 minutes écoulées"]]},
  dtp:{label:"DTP 2 heures",total:7200,jalons:[[600,"Fin de la lecture du sujet — commence I. Alerte"],[2100,"Fin de I. Alerte — attaque l'ASLL (6 pts)"],[4900,"Fin de l'ASLL — passe aux actions (4 pts)"],[7100,"Fin des actions — PASSATION (6 pts)"],[7200,"STOP — rends ta copie"]]},
  qmf:{label:"Épreuve sportive (préparation)",total:600,jalons:[[300,"Moitié du temps — garde du rythme"],[480,"1 minute 20 restantes"],[600,"STOP"]]}
};
function tmStart(mode){tmStop();TIM.mode=mode;TIM.left=CHRONOS[mode].total;TIM.next=0;TIM.run=true;TIM.end=Date.now()+TIM.left*1000;TIM.id=setInterval(tmTick,500);renderChrono();}
function tmStop(){if(TIM.id){clearInterval(TIM.id);TIM.id=null;}TIM.run=false;}
function tmReset(){tmStop();TIM.mode=null;TIM.left=0;renderChrono();}
function tmTick(){
  TIM.left=Math.max(0,Math.round((TIM.end-Date.now())/1000));
  var c=CHRONOS[TIM.mode],j=c.jalons;
  while(TIM.next<j.length&&TIM.left<=c.total-j[TIM.next][0]){
    vib([300,150,300]);if(TIM.next===j.length-1)vib([600]);
    TIM.next++;
  }
  if(TIM.left<=0){tmStop();vib([600,200,600,200,600]);}
  renderChrono();
}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
/* ---------- QUIZ ---------- */
var Q={list:[],idx:0,score:0,answered:false,lastMode:null,themeN:0};
function quizStart(mode,n){
  if(mode==="theme"){
    var t=theme(n);Q.list=ALLQ.filter(function(x){return x.n===n;}).map(function(x){return{x:x,done:false,ok:false};});
    Q.themeN=n;
  }else if(mode==="hor"){
    Q.list=HQ.filter(function(x){return x.hid===n;}).map(function(x){return{x:x,done:false,ok:false};});
    Q.themeN=n;
  }else if(mode==="allh"){
    var arrh=HQ.slice();
    for(var ih=arrh.length-1;ih>0;ih--){var jh=Math.floor(Math.random()*(ih+1)),tmph=arrh[ih];arrh[ih]=arrh[jh];arrh[jh]=tmph;}
    Q.list=arrh.map(function(x){return{x:x,done:false,ok:false};});
  }else if(mode==="fail"){
    var f=[];
    D.THEMES.forEach(function(t){var z=S.quiz[t.n]||{};t.quiz.forEach(function(q,i){if(z[i]===false)f.push({n:t.n,titre:t.titre,q:q,i:i});});});
    D.HORIZON.forEach(function(h){var z=S.quiz["h"+h.n]||{};h.quiz.forEach(function(q,i){if(z[i]===false)f.push({hid:h.n,titre:h.titre,q:q,i:i});});});
    Q.list=f.map(function(x){return{x:x,done:false,ok:false};});
  }else{
    var arr=ALLQ.slice();
    for(var i=arr.length-1;i>0;i--){var jx=Math.floor(Math.random()*(i+1)),tmp=arr[i];arr[i]=arr[jx];arr[jx]=tmp;}
    Q.list=arr.map(function(x){return{x:x,done:false,ok:false};});
  }
  Q.idx=0;Q.score=0;Q.answered=false;Q.lastMode=mode;
  renderApp("quiz");
}
function quizAnswer(oi){
  if(Q.answered)return;
  Q.answered=true;
  var cur=Q.list[Q.idx],ok=(oi===cur.x.q.a);
  cur.done=true;cur.ok=ok;
  if(ok)Q.score++;
  var key=cur.x.hid?("h"+cur.x.hid):(""+cur.x.n);
  var qz=S.quiz[key]=S.quiz[key]||{};
  qz[cur.x.i]=ok;
  if(!cur.x.hid){
    var t=theme(cur.x.n),z=quizTot(t);
    if(z.ok>=z.tot&&(S.prog[t.n]==="fiche"||S.prog[t.n]==="afaire"))S.prog[t.n]="quiz";
  }
  save();renderApp("quiz");
}
function quizNext(){
  Q.idx++;Q.answered=false;
  if(Q.idx>=Q.list.length){Q.idx=Q.list.length;renderApp("quiz");return;}
  renderApp("quiz");
}
/* ---------- RENDER ---------- */
var lastTab=null;
function renderApp(tab){
  if(tab)S.ui.tab=tab;
  save();
  var el=document.getElementById("app");if(!el)return;
  el.innerHTML=viewTab(S.ui.tab);
  var tb=document.getElementById("tabbar");
  if(tb)tb.innerHTML=tabbar();
  if(lastTab!==S.ui.tab){window.scrollTo(0,0);lastTab=S.ui.tab;}
}
function tabbar(){
  var tabs=[["home","🏠","Accueil"],["oral","🎤","Oral"],["quiz","✅","Quiz"],["dtp","✍️","DTP"],["chrono","⏱️","Chrono"],["cdg","⭐","CDG"],["horizon","🌍","Horizon"]];
  return tabs.map(function(t){
    return '<button class="tb'+(S.ui.tab===t[0]?" on":"")+'" onclick="window.__BHT_APP.tab(\''+t[0]+'\')"><span class="tb-i">'+t[1]+'</span><span class="tb-l">'+t[2]+'</span></button>';
  }).join("");
}
function viewTab(t){
  if(t==="oral")return viewOral();
  if(t==="quiz")return viewQuiz();
  if(t==="dtp")return viewDTP();
  if(t==="chrono")return viewChrono();
  if(t==="cdg")return viewCDG();
  if(t==="horizon")return viewHorizon();
  return viewHome();
}
function head(t,s){return '<div class="head"><h1>'+t+'</h1><p class="sub">'+s+'</p></div>';}
function viewHome(){
  var pct=progPct();
  var cnt={afaire:0,fiche:0,quiz:0,pret:0};
  D.THEMES.forEach(function(t){cnt[S.prog[t.n]]++;});
  var nextT=null;
  D.THEMES.forEach(function(t){if(!nextT&&S.prog[t.n]!=="pret")nextT=t;});
  var qok=0;D.THEMES.forEach(function(t){qok+=quizTot(t).ok;});
  var h='<div class="head"><h1>Révision BHT</h1><p class="sub">'+esc(D.META.sub)+' — v'+D.META.version+' · '+D.META.date+'</p></div>';
  h+='<div class="grid2"><div class="card center">'+donut(pct)+'</div>';
  h+='<div class="card"><h3>État des 21 thèmes</h3><div class="statrow"><span style="color:'+SCL.pret+'">● Prêt oral</span><b>'+cnt.pret+'</b></div><div class="statrow"><span style="color:'+SCL.quiz+'">◕ Quiz réussi</span><b>'+cnt.quiz+'</b></div><div class="statrow"><span style="color:'+SCL.fiche+'">◔ Fiche faite</span><b>'+cnt.fiche+'</b></div><div class="statrow"><span style="color:'+SCL.afaire+'">○ À faire</span><b>'+cnt.afaire+'</b></div><hr><div class="statrow"><span>Quiz réussis</span><b>'+qok+' / '+ALLQ.length+'</b></div></div></div>';
  h+='<div class="grid2"><div class="card"><h3>🎯 Action du jour</h3>'+(nextT?
    '<p>Prochain thème à travailler : <b>'+nextT.n+'. '+esc(nextT.titre)+'</b></p><button class="btn" onclick="window.__BHT_APP.openTheme('+nextT.n+')">Ouvrir le thème '+nextT.n+'</button>'
    :'<p>Tous les thèmes sont prêts ! Entretiens ton niveau : marathon quiz, sujets surprises, oraux blancs chronométrés.</p>')+'</div>';
  h+='<div class="card"><h3>🎲 Sujet au hasard</h3><p>Un sujet tiré au sort — traite-le en 10 minutes chrono.</p><button class="btn" onclick="window.__BHT_APP.draw()">Tirer un sujet</button><div id="drawbox"></div></div></div>';
  h+='<div class="card"><h3>⏱️ Accès rapide</h3><div class="grid3">'+
   '<button class="btn sm" onclick="window.__BHT_APP.tab(\'chrono\');window.__BHT_APP.start(\'oral\')">Oral 10 min</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.tab(\'chrono\');window.__BHT_APP.start(\'dtp\')">DTP 2 h</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.quizStart(\'all\',0)">Marathon quiz</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.tab(\'dtp\')">Épreuve écrite</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.tab(\'cdg\')">Fiche chef de groupe</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.tab(\'horizon\')">🌍 Hors-thèmes</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.quizStart(\'fail\',0)">Mes erreurs</button></div></div>';
  return h;
}
function viewOral(){
  var h=head("🎤 Oral — 21 thèmes","Tapote un thème pour ouvrir le script 10 minutes. Tapote le badge pour faire évoluer ton avancement.");
  D.THEMES.forEach(function(t){
    var st=S.prog[t.n];
    h+='<div class="acc"><button class="acc-h" onclick="window.__BHT_APP.openTheme('+t.n+')"><span class="tnum">'+t.n+'</span><span class="ttit">'+esc(t.titre)+(t.full?"":' <span class="warn">[fiche à faire]</span>')+'</span><span class="badge" style="background:'+SCL[st]+'">'+SEMO[st]+'</span></button>';
    if(S.ui.theme===t.n){
      h+='<div class="acc-b">';
      h+='<div class="tips"><b>Accroche :</b> '+esc(t.accroche)+'</div>';
      h+='<div class="tips"><b>Problématique :</b> '+esc(t.pb)+'</div>';
      t.parties.forEach(function(p){
        h+='<div class="part"><h4>'+esc(p.t)+'</h4><ul>'+p.pts.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';
      });
      h+='<div class="tips ccl"><b>Conclusion :</b> '+esc(t.ccl)+'</div>';
      h+='<div class="tips qj"><b>Question jury :</b> '+esc(t.qj.q)+'<br><b>Réponse :</b> '+esc(t.qj.r)+'</div>';
      h+='<div class="grid2"><button class="btn sm" onclick="window.__BHT_APP.quizStart(\'theme\','+t.n+')">Quiz du thème ('+t.quiz.length+' q.)</button>'+
       '<button class="btn sm" onclick="window.__BHT_APP.tab(\'chrono\');window.__BHT_APP.start(\'oral\')">Oral blanc 10 min</button></div>';
      if(S.prog[t.n]==="pret")h+='<button class="btn sm" onclick="window.__BHT_APP.resetTheme('+t.n+')">↺ Revenir à « à faire »</button>';

      h+='</div>';
    }
    h+='</div>';
  });
  h+='<p class="foot">Avancement : tapote le badge couleur du thème — À faire → Fiche → Quiz → Prêt oral.</p>';

}
function viewQuiz(){
  if(Q.list.length&&Q.idx<Q.list.length){
    var cur=Q.list[Q.idx],q=cur.x.q;
    var label=Q.lastMode==="hor"||Q.lastMode==="allh"?"Horizon — "+esc(cur.x.titre):"thème "+cur.x.n;
    var h=head("✅ Quiz — "+(Q.lastMode==="theme"?"thème "+cur.x.n:Q.lastMode==="fail"?"mes erreurs":Q.lastMode==="hor"?"horizon "+cur.x.titre:Q.lastMode==="allh"?"marathon horizon":"marathon"),"Question "+(Q.idx+1)+" / "+Q.list.length+" · Score : "+Q.score);
    h+='<div class="card qcard"><div class="qmeta">'+label+'</div>';
    h+='<div class="qq">'+esc(q.q)+'</div><div class="opts">';
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(Q.answered){
        if(i===q.a)cls+=" ok";
        else if(i===Q.lastPick)cls+=" ko";
      }
      h+='<button class="'+cls+'" onclick="window.__BHT_APP.pick('+i+')">'+String.fromCharCode(65+i)+". "+esc(o)+'</button>';
    });
    h+='</div>';
    if(Q.answered){
      h+='<div class="expl '+(Q.lastOk?"good":"bad")+'">'+(Q.lastOk?"✔ Bonne réponse":"✘ Faux — réponse : "+String.fromCharCode(65+q.a))+' — '+esc(q.ex)+'</div>';
      h+='<button class="btn" onclick="window.__BHT_APP.next()">'+(Q.idx+1<Q.list.length?"Question suivante →":"Voir le résultat")+'</button>';
    }
    h+='</div>';
    return h;
  }
  if(Q.list.length&&Q.idx>=Q.list.length){
    var pctq=Math.round(100*Q.score/Q.list.length);
    var h=head("✅ Résultat",Q.lastMode==="theme"?"Thème "+Q.themeN:Q.lastMode==="fail"?"Mes erreurs":Q.lastMode==="hor"?"Horizon "+Q.themeN:Q.lastMode==="allh"?"Marathon horizon":"Marathon");
    h+='<div class="card center"><div class="bigscore">'+Q.score+' / '+Q.list.length+'</div><div class="'+(pctq>=80?"good":"bad")+'">'+pctq+'% — '+(pctq>=80?"Validé ✔":pctq>=50?"Presque — refais-le":"À retravailler")+'</div></div>';
    h+='<div class="grid2"><button class="btn sm" onclick="window.__BHT_APP.quizStart(\''+(Q.lastMode||"all")+'\','+Q.themeN+')">Recommencer</button><button class="btn sm" onclick="window.__BHT_APP.quizEnd()">Retour aux quiz</button></div>';
    return h;
  }
  var h=head("✅ Quiz","Réponse et explication immédiates après chaque question — comme au combat, on corrige tout de suite.");
  h+='<div class="card"><h3>Par thème</h3><div class="tgrid">';
  D.THEMES.forEach(function(t){
    var z=quizTot(t);
    h+='<button class="tqbtn" onclick="window.__BHT_APP.quizStart(\'theme\','+t.n+')"><b>'+t.n+'</b> '+esc(t.titre)+'<span class="qsc">'+z.ok+'/'+z.tot+'</span></button>';
  });
  h+='</div></div>';
  h+='<div class="grid2"><div class="card"><h3>🌍 Horizon</h3><div class="tgrid">';
  D.HORIZON.forEach(function(x){
    var z=hqTot(x.n);
    h+='<button class="tqbtn" onclick="window.__BHT_APP.quizStart(\'hor\','+x.n+')"><span>'+x.ic+'</span><b>'+esc(x.titre)+'</b><span class="qsc">'+z.ok+'/'+z.tot+'</span></button>';
  });
  h+='</div><button class="btn sm" onclick="window.__BHT_APP.quizStart(\'allh\',0)">🧨 Marathon Horizon ('+HQ.length+' q.)</button></div></div>';
  h+='<div class="grid3">'+
   '<button class="btn sm" onclick="window.__BHT_APP.quizStart(\'all\',0)">🧨 Marathon — '+ALLQ.length+' questions</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.quizStart(\'fail\',0)">❌ Mes erreurs</button></div>';
  return h;
}
function viewDTP(){
  var d=D.DTP;
  var h=head("✍️ DTP — épreuve écrite","Devoir technique professionnel : 2 heures, chef d'agrès FI. Barème /20 : alerte 4 · ASLL 6 · actions 4 · passation 6.");
  h+='<div class="grid2"><div class="card"><h3>Format</h3>'+d.format.map(function(r){return '<div class="statrow"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>';}).join("")+'</div>';
  h+='<div class="card"><h3>⏱️ Timing 2 heures</h3>'+d.timing.map(function(r){return '<div class="statrow"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>';}).join("")+'</div></div>';
  h+='<div class="card warn"><h3>Règle d\u2019or</h3><p>'+esc(d.regle)+'</p></div>';
  d.trame.forEach(function(sec,si){
    var open=S.ui.dtpOpen===si;
    h+='<div class="acc"><button class="acc-h" onclick="window.__BHT_APP.dtpToggle('+si+')"><span class="ttit">'+esc(sec.t)+'</span><span class="chev">'+(open?"▾":"▸")+'</span></button>';
    if(open){
      h+='<div class="acc-b">';
      sec.subs.forEach(function(sub,sb){
        var ck=(S.dtp["c"+si+"_"+sb])?"☑":"☐";
        h+='<div class="part"><h4>'+ck+' '+esc(sub.h)+'</h4><ul>'+sub.pts.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';
      });
      h+='<button class="btn sm" onclick="window.__BHT_APP.dtpDone('+si+')">Section révisée ✔</button></div>';
    }
    h+='</div>';
  });
  h+='<div class="card"><h3>⚡ 10 réflexes DTP</h3><ol class="reflex">'+d.reflexes.map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+'</ol></div>';
  h+='<div class="card"><h3>📚 Glossaire</h3><table class="tbl"><tr><th>Sigle</th><th>Sens</th></tr>'+d.glossaire.map(function(g){return '<tr><td><b>'+esc(g[0])+'</b></td><td>'+esc(g[1])+'</td></tr>';}).join("")+'</table></div>';
  var exOpen=S.ui.exOpen;
  h+='<div class="acc"><button class="acc-h" onclick="window.__BHT_APP.exToggle()"><span class="ttit">🎓 '+esc(D.DTP.exemple.t)+' (corrigé type)</span><span class="chev">'+(exOpen?"▾":"▸")+'</span></button>';
  if(exOpen){h+='<div class="acc-b"><ul>'+D.DTP.exemple.pts.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';}
  h+='</div>';
  return h;
}
function viewChrono(){
  var c=TIM.mode?CHRONOS[TIM.mode]:null;
  var left=TIM.mode?TIM.left:0;
  var h=head("⏱️ Chronos","Oral 10 minutes jalonné · DTP 2 heures · vibreur à chaque jalon.");
  h+='<div class="card center chrono">';
  if(c){
    var tot=c.total,pct=Math.round(100*(tot-left)/tot);
    var jn=c.jalons[Math.max(0,TIM.next-1)];
    var phase=TIM.next===0?"En route — jalon 1 à "+fmt(c.total-c.jalons[0][0]):"Jalon "+TIM.next+" / "+(c.jalons.length-1)+" — "+esc(jn[1]);
    h+='<div class="bigtime">'+fmt(left)+'</div><div class="plabel">'+esc(c.label)+'</div>';
    h+='<div class="pbar"><div style="width:'+pct+'%"></div></div>';
    h+='<div class="phase">'+phase+'</div>';
    var jl=c.jalons.map(function(j,i){return '<div class="statrow"><span>'+fmt(tot-j[0])+' — '+esc(j[1])+'</span><b>'+(i<TIM.next?"✓":"")+'</b></div>';}).join("");
    h+=jl;
    h+='<div class="grid3">'+(TIM.run?'<button class="btn sm" onclick="window.__BHT_APP.pause()">⏸ Pause</button>':'<button class="btn sm" onclick="window.__BHT_APP.resume()">▶ Reprendre</button>')+'<button class="btn sm" onclick="window.__BHT_APP.reset()">⟲ Reset</button></div>';
  }else{
    h+='<div class="bigtime">10:00</div><p>Choisis une épreuve :</p>';
  }
  h+='</div>';
  h+='<div class="grid3">'+
   '<button class="btn sm" onclick="window.__BHT_APP.start(\'oral\')">🎤 Oral 10 min</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.start(\'dtp\')">✍️ DTP 2 h</button>'+
   '<button class="btn sm" onclick="window.__BHT_APP.start(\'qmf\')">💪 Sport 10 min</button></div>';
  h+='<div class="card"><h3>🎲 Tirage de sujet</h3><p>Tirage au sort parmi les thèmes pas encore prêts + sujets surprises.</p><button class="btn" onclick="window.__BHT_APP.draw()">Tirer un sujet</button><div id="drawbox"></div></div>';
  return h;
}
function viewHorizon(){
  var h=head("🌍 Horizon — hors thèmes","Culture générale pour le jury : sécurité civile, Marine, prévention, BMPM, défense. Contenu sourcé de tes documents Drive.");
  h+='<div class="card"><h3>Quiz Horizon</h3><div class="tgrid">';
  D.HORIZON.forEach(function(x){
    var z=hqTot(x.n);
    h+='<button class="tqbtn" onclick="window.__BHT_APP.quizStart(\'hor\','+x.n+')"><span>'+x.ic+'</span><b>'+esc(x.titre)+'</b><span class="qsc">'+z.ok+'/'+z.tot+'</span></button>';
  });
  h+='</div><button class="btn sm" onclick="window.__BHT_APP.quizStart(\'allh\',0)">🧨 Marathon Horizon — '+HQ.length+' questions</button></div>';
  var nbRevus=D.HORIZON.filter(function(x){return S.hor["r"+x.n];}).length;
  D.HORIZON.forEach(function(x){
    var open=S.ui.horOpen===x.n;
    h+='<div class="acc"><button class="acc-h" onclick="window.__BHT_APP.openHor('+x.n+')"><span class="tnum">'+x.ic+'</span><span class="ttit">'+esc(x.titre)+'</span><span class="badge" style="background:#263258">'+(open?"▾":"▸")+'</span></button>';
    if(open){
      h+='<div class="acc-b">';
      h+='<div class="tips"><b>Source :</b> '+esc(x.src)+'</div>';
      x.sections.forEach(function(sec){
        h+='<div class="part"><h4>'+esc(sec.t)+'</h4><ul>'+sec.pts.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+'</ul></div>';
      });
      h+='<div class="grid2"><button class="btn sm" onclick="window.__BHT_APP.quizStart(\'hor\','+x.n+')">Quiz '+esc(x.titre)+' ('+x.quiz.length+' q.)</button>'+
       '<button class="btn sm" onclick="window.__BHT_APP.horDone('+x.n+')">'+(S.hor["r"+x.n]?"↺ Dé-marquer relu":"✔ Marquer relu")+'</button></div>';
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<p class="foot">'+(nbRevus?'<span class="chip-ok">✔ '+nbRevus+' relu'+(nbRevus>1?"s":"")+'</span> ':'')+'Astuce jury : quand tu traites un des 21 thèmes, conclus par un lien vers un domaine Horizon (ex. FDF → prévention/RCCI, feu urbain → sécurité civile/PCS) — ça montre la vue d\'ensemble du chef de groupe.</p>';
  return h;
}

function viewCDG(){
  var c=D.CDG;
  var h=head("⭐ Chef de groupe","Le rôle, les chiffres clés, la méthode — ta feuille de route BHT.");
  h+='<div class="card"><h3>Mon rôle de chef de groupe</h3><ul class="role">'+c.role.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';
  h+='<div class="card"><h3>Chiffres à connaître par cœur</h3><div class="grid3">'+c.chiffres.map(function(x){return '<div class="kpi"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>';}).join("")+'</div></div>';
  h+='<div class="card"><h3>⏱️ Calage de l\u2019oral (10 min)</h3><table class="tbl"><tr><th>Temps</th><th>Étape</th><th>Contenu</th></tr>'+D.CALAGE.map(function(r){return '<tr><td><b>'+r.t+'</b></td><td>'+esc(r.p)+'</td><td>'+esc(r.d)+'</td></tr>';}).join("")+'</table></div>';
  h+='<div class="card"><h3>🔨 Règles d\u2019or de l\u2019oral</h3><ol class="reflex">'+D.REGLESOR.map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+'</ol></div>';
  h+='<div class="card"><h3>🔗 Liens transversaux</h3><ul class="role">'+D.TRANSVERSAL.map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+'</ul></div>';
  h+='<div class="card"><h3>🎯 La méthode</h3><p>'+esc(c.methode)+'</p></div>';
  return h;
}
function drawBox(){
  var box=document.getElementById("drawbox");if(!box)return;
  var d=tirage();
  var btn=d.type==="theme"?'<button class="btn sm" onclick="window.__BHT_APP.openTheme('+d.n+')">Ouvrir le thème</button>':"";
  var chro='<button class="btn sm" onclick="window.__BHT_APP.tab(\'chrono\');window.__BHT_APP.start(\'oral\')">Chrono 10 min</button>';
  box.innerHTML='<div class="drawcard"><div class="dtag">'+(d.type==="theme"?"Thème "+d.n:"SUJET SURPRISE")+'</div><div class="dtxt">'+esc(d.txt)+'</div><div class="grid2">'+btn+chro+'</div></div>';
}
/* ---------- API ---------- */
var API={
  D:D,state:S,keys:K,ALLQ:function(){return ALLQ;},
  tab:function(t){renderApp(t);},
  openHor:function(n){S.ui.tab="horizon";S.ui.horOpen=(S.ui.horOpen===n?0:n);save();renderApp();},
  horDone:function(n){if(S.hor["r"+n])delete S.hor["r"+n];else S.hor["r"+n]=true;save();renderApp();},
  openTheme:function(n){S.ui.tab="oral";S.ui.theme=(S.ui.theme===n?0:n);save();renderApp();var el=document.getElementById("acc-"+n);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth"});},
  cycle:cycle,resetTheme:resetTheme,
  draw:function(){drawBox();},
  note:function(n,v){S.notes[n]=v;sv(K.notes,S.notes);},
  quizStart:quizStart,quizAnswer:quizAnswer,quizNext:quizNext,
  pick:function(i){Q.lastPick=i;Q.lastOk=(i===Q.list[Q.idx].x.q.a);quizAnswer(i);},
  next:function(){quizNext();},
  quizEnd:function(){Q.list=[];Q.idx=0;renderApp("quiz");},
  dtpToggle:function(si){S.ui.dtpOpen=(S.ui.dtpOpen===si?-1:si);save();renderApp("dtp");},
  exToggle:function(){S.ui.exOpen=!S.ui.exOpen;save();renderApp("dtp");},
  dtpDone:function(si){var d=D.DTP.trame[si];d.subs.forEach(function(x,sb){S.dtp["c"+si+"_"+sb]=true;});save();renderApp("dtp");},
  start:tmStart,pause:function(){if(TIM.run){clearInterval(TIM.id);TIM.id=null;TIM.run=false;}renderChrono();},
  resume:function(){if(TIM.mode&&!TIM.run){TIM.end=Date.now()+TIM.left*1000;TIM.run=true;TIM.id=setInterval(tmTick,500);}renderChrono();},
  reset:tmReset,
  timerState:function(){return{mode:TIM.mode,left:TIM.left,run:TIM.run,next:TIM.next};},
  qState:function(){return{idx:Q.idx,len:Q.list.length,score:Q.score,answered:Q.answered,cur:(Q.list[Q.idx]?Q.list[Q.idx].x:null),mode:Q.lastMode};},
  chronos:function(){return CHRONOS;},
  _tick:tmTick,
  progPct:progPct
};;
function renderChrono(){if(S.ui.tab==="chrono")renderApp("chrono");}
buildQuiz();
window.__BHT_APP=API;
if(typeof navigator!=="undefined"&&navigator.serviceWorker){
  try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}
}
function boot(){
  if(document.getElementById("tabbar"))document.getElementById("tabbar").innerHTML=tabbar();
  renderApp(S.ui.tab);
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
if(typeof module!=="undefined"&&module.exports){module.exports=API;}
})();

</script>
